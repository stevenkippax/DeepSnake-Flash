name: Test and build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm test
      - run: npm run build
      - run: node --check dist/deepsnake-flash.js
      - uses: actions/upload-artifact@v7
        with:
          name: deepsnake-flash
          path: dist/
